name: Checks

# Keeps the kit honest on every change, and builds what Pages publishes: the
# generated theme, the resolved token snapshot and the registry index must
# match their sources, the one install must be whole, and the Storybook
# catalog must build under the Vite pipeline (which silently drops misordered
# @imports — see the README's troubleshooting section) with every story
# passing its interaction test and axe.
#
# Called by pages.yml on a push to main: the site it publishes is the `_site`
# this job assembled, after every step above it passed on the same commit.
# Only a release publishes: the step "Does this run publish?" decides, and
# pages.yml deploys on its word alone. See the README, "Publishing this
# repository".
on:
  pull_request:
  workflow_call:
    outputs:
      publish:
        description: "'true' when this run publishes: only a release does (scripts/decide-publish.mjs)"
        value: ${{ jobs.checks.outputs.publish }}

jobs:
  checks:
    name: Tokens, registry & Storybook
    runs-on: ubuntu-latest
    # The screenshots add about eight minutes to the story tests: see
    # vitest.config.ts and .storybook/screenshot.setup.ts.
    timeout-minutes: 35
    # Every step runs in the Playwright image for the version package.json
    # pins: the Chromium and the fonts the screenshot baselines were made with
    # (`npm run screenshots:update` makes them in this same image).
    # `npm run storybook:check` holds this tag to the pin.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host --init
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A hand start reads the history back to the release's commit; every
          # other run needs the one commit.
          fetch-depth: ${{ github.event_name != 'workflow_dispatch' && 1 || 0 }}

      - uses: actions/setup-node@v7
        with:
          # Pinned major (Node 24 = npm 12) so a new LTS cannot change npm's
          # lockfile validation under us; bump deliberately with package-lock.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: The theme is generated from DESIGN.md
        # One file is edited by hand: DESIGN.md, the neutral default the kit
        # ships. The theme in tokens/ and the complete DESIGN.md written back
        # beside it for agents are generated.
        run: |
          npm run theme:generate
          git diff --exit-code -- \
            tokens/theme.css tokens/theme.v4.css tokens/DESIGN.resolved.md \
            || { echo "::error::the theme is stale or was edited by hand — edit DESIGN.md, run 'npm run theme:generate' and commit"; exit 1; }

      - name: The two DESIGN.md files pass the format's linter
        run: npm run design:lint

      - name: DESIGN.md derivation rules, and the theme is its file's
        run: npm run theme:check

      - name: Resolved tokens are up to date
        run: |
          npm run theme:resolve
          git diff --exit-code -- tokens/resolved.json \
            || { echo "::error::tokens/resolved.json is stale — run 'npm run theme:resolve' and commit it"; exit 1; }

      - name: Registry index is up to date, and the registry builds
        # registry.json and the release record (RELEASE.json, what a project's
        # update check reads) are committed and must be what the build writes.
        # The built items in r/ are not committed: they are built here and
        # published from here.
        run: |
          npm run registry:build
          git diff --exit-code -- registry.json RELEASE.json \
            || { echo "::error::registry.json or RELEASE.json is stale — run 'npm run registry:build' and commit both"; exit 1; }

      - name: Registry items carry the kit version
        # package.json `version` is the only source of truth; the build stamps
        # it into every item's meta.version.
        run: npm run registry:check-version

      - name: The one install is whole, and its skills are the kit's
        # `shadcn add @ds/ds` must reach the DESIGN.md generator, every skill
        # and every file a skill names; an item that carries a script declares
        # what it imports; and no skill names this repository, since a skill
        # is read in whatever project installed the kit.
        run: npm run registry:check-install

      - name: Storybook serve and stop keep to their worktree; the browser server answers
        # `npm run storybook:serve` and `storybook:stop` against a stand-in
        # server, two at once, and the playwright MCP server .mcp.json names
        # listing its tools. No browser and no real Storybook start here.
        run: npm run storybook:check

      - name: Every exported component carries its doc comment
        # On the exported declaration, where an editor's hover and the types
        # a project generates read it, not on the styles above it.
        run: npm run docs:check

      - name: Does this run publish? Only a release does
        # The version is read in the five places a release writes it, in this
        # tree and in the commit before the push (the base, on a pull
        # request). A pull request never publishes: it is told what its merge
        # would. A tree whose places disagree fails here.
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ -n "${BASE//0/}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE" \
              || echo "::warning::the commit before ($BASE) could not be fetched"
          fi
          npm run registry:publishes -- --event "$GITHUB_EVENT_NAME" --base "$BASE" --ref "$GITHUB_REF"

      - name: Spec drift (m3.material.io moved since the last audit?)
        continue-on-error: true
        run: npm run md3 -- check --strict

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Build Storybook
        id: build
        run: npm run build-storybook -- --quiet

      # The quality net. Every story is a test: it renders, its `play`
      # function runs if it has one, and axe checks the result — once under
      # the shipped Material tokens and once under the Editorial preset,
      # because a component that is only accessible under one palette is not
      # accessible. Then its page is compared, in light and in dark, to its
      # baseline in screenshots/. The image already holds Chromium. The bar
      # for a new component is in conventions.md.
      - name: Interaction tests, axe and screenshots over the catalog
        env:
          MD3_SCREENSHOTS: "1"
        run: npm run test-storybook

      # After the story tests, and whatever they said: a new story with no
      # baseline is drawn by them (its `-reference.png`, kept below), so a
      # session without Docker has its pictures to commit.
      - name: Every story's screenshots are committed, and none outlives its story
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-screenshots.mjs storybook-static/index.json

      # A failed comparison's expected, actual and diff images, kept with the
      # run and listed in its summary, for the reviewer and the owner.
      - name: Gather the screenshots that changed
        if: failure()
        run: node scripts/screenshots-report.mjs

      - name: Keep the screenshots that changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .vitest-attachments/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble the site
        # Storybook builds with relative asset paths, so it serves correctly
        # from the repository subpath with no base-path config. A directory
        # listing is not served, so /r is reached through its index.
        run: |
          mkdir -p _site
          cp -R storybook-static/. _site/
          cp -R r _site/r
          test -f _site/index.html
          test -f _site/r/registry.json
          test -f _site/r/ds.json
          echo "site: $(find _site/r -name '*.json' | wc -l) registry files"

      # The artifact pages.yml deploys. On a pull request it is only kept for
      # reading: nothing publishes it.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 7
