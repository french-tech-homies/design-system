name: Pages

# Publishes the kit's public surface on GitHub Pages: the Storybook catalog at
# the site root and the shadcn registry at /r/{name}.json.
#
# Only a release publishes. Every push to `main` is checked: the `checks` job
# runs checks.yml whole on this commit and assembles the site. `publish` needs
# it and deploys the artifact that job uploaded, but only when its decision
# (scripts/decide-publish.mjs) says so: the push moved the version in every
# place a release writes it. A merge that changes no version publishes nothing
# and the previous site stays; so does a build that fails any check. The built
# registry is not committed.
#
# Once a release's push is published, `tag` tags its commit `vX.Y.Z` and makes
# its GitHub release, with its section of CHANGELOG.md as the notes
# (scripts/release.mjs). The release itself is the pull request release-pr.yml
# keeps open.
#
# Started by hand (`workflow_dispatch`), it publishes again what the last
# release holds, and nothing once `main` has moved past it: the run then says
# which release that is. The rule is in CONTRIBUTING.md, "Publishing this
# repository".
#
# ONE-TIME HUMAN STEP: Settings → Pages → Build and deployment → Source =
# "GitHub Actions". Until that is done this workflow fails at "Configure
# Pages". See CONTRIBUTING.md, "Publishing this repository".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, write the Pages deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  publish:
    name: Catalog + registry → GitHub Pages
    needs: checks
    if: needs.checks.outputs.publish == 'true'
    # One publish at a time; let a newer release supersede a queued one, but
    # never cancel a deployment that is already running. The group is this
    # job's, not the workflow's, and a run that publishes nothing has a group
    # of its own: an ordinary merge can then never cancel a release's run.
    concurrency:
      group: ${{ needs.checks.outputs.publish == 'true' && 'pages' || format('pages-not-published-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        # Fails with "Get Pages site failed" until Pages is enabled on the
        # repository with Source = GitHub Actions. That is a one-time human
        # step; see the header of this file.

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Where it landed
        run: |
          echo "catalog:  ${{ steps.deploy.outputs.page_url }}"
          echo "registry: ${{ steps.deploy.outputs.page_url }}r/{name}.json"

  tag:
    name: Tag the release, and its GitHub release
    # After the release is published, and only on its push: a hand start
    # publishes again on `main`'s tip, which is not the release's commit.
    # The tag is what release-pr.yml reads the next release's pull requests
    # since; its run after this one opens that pull request.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the tag and the release, made through the API
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tag the commit vX.Y.Z, its notes the CHANGELOG's section
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs tag
